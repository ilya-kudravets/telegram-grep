name: Release

# release-please watches main: it maintains a "release PR" that bumps
# package.json + CHANGELOG from conventional commits (feat/fix/…). Merging that
# PR creates the vX.Y.Z tag and GitHub release — no manual tagging. The build
# job then compiles the `tg-client` binaries and attaches them to that release.
#
# The telegram-grep-cli skill downloads these assets by their
# `tg-client-<os>-<arch>` names. Each target builds on its matching OS/arch
# runner: @opentui/core (pulled in via src/index.ts) ships per-platform native
# binaries, so a native `--compile` per runner is reliable where cross-compiling
# is not. release-please keeps the tag and package.json version in lockstep by
# construction, so no separate version-match guard is needed.
on:
  push:
    branches: [main]
  # recovery hatch: rebuild and re-upload the binaries for a tag that already exists
  # (e.g. a runner image was retired and one matrix leg never produced its asset)
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build binaries for, e.g. v0.2.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  build:
    needs: release-please
    # release-please is skipped on a manual dispatch, so !cancelled() keeps this reachable
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created || inputs.tag) }}
    strategy:
      matrix:
        include:
          - runs-on: macos-14
            asset: tg-client-darwin-arm64
          # macos-13 was retired: its jobs sit queued forever and never attach an asset
          - runs-on: macos-15-intel
            asset: tg-client-darwin-x64
          - runs-on: ubuntu-latest
            asset: tg-client-linux-x64
          - runs-on: ubuntu-24.04-arm
            asset: tg-client-linux-arm64
    runs-on: ${{ matrix.runs-on }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun build apps/cli/src/index.ts --compile --outfile ${{ matrix.asset }}
      - env:
          GH_TOKEN: ${{ github.token }}
        # --clobber so a re-dispatch replaces an asset instead of failing on the name
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber
