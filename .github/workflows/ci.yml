name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# cancel superseded runs on the same ref (e.g. rapid PR pushes); never queue two
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # fails the job on known-vulnerable production dependencies
      # (dev-only tooling vulns are handled by Dependabot bumps, not a release gate)
      #
      # ignored: GHSA-w5hq-g745-h8pq (uuid <11.1.1 buffer bounds check in v3/v5/v6
      # when `buf` is provided). Reaches us only via xcode@3 → @expo/config-plugins,
      # a build-time tool run during `expo prebuild`; it calls uuid.v4() with no buf,
      # and none of it is bundled into the shipped app. xcode pins uuid ^7, so the
      # only "fix" is force-bumping a transitive build dep across a major — riskier
      # than the moderate it clears. Drop this when the expo/xcode chain moves off it.
      - run: bun audit --prod --ignore GHSA-w5hq-g745-h8pq
