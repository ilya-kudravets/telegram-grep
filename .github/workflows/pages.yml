name: Pages

# Publishes the server-less browser client (apps/web/web/static.html). Nothing secret
# is built in: the user supplies their own api_id/api_hash at first launch, so the
# artifact is the same for everyone and needs no repository secrets.
#
# Does nothing until Pages is enabled for the repository with "GitHub Actions" as the
# source (Settings → Pages) — the deploy step fails fast otherwise.
on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages needs exactly these; contents stays read-only
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and never cancel one mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build:pages
      # Pages serves the artifact root, and a project page serves it under /<repo>/ —
      # the bundle's asset paths are relative, so both work. index.html is what Pages
      # looks for; the build emits static.html.
      - run: cp dist/pages/static.html dist/pages/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
